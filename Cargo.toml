[workspace]
members = [
    "crates/pidjezdy-cli",
    "crates/pidjezdy-core",
    "crates/pidjezdy-pid",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Malanius/pidjezdy"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

