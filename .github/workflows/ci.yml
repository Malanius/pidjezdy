name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check plugin and CLI contracts match
        run: |
          node -e '
            const fs = require("fs");
            const childProcess = require("child_process");
            const model = require("./Model.js");
            const metadata = JSON.parse(childProcess.execFileSync(
              "cargo", ["metadata", "--no-deps", "--format-version", "1"],
              { encoding: "utf8" }
            ));
            const cli = metadata.packages.find(pkg => pkg.name === "pidjezdy");
            const plugin = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (!cli || plugin.version !== cli.version) {
              console.error(`plugin version ${plugin.version} does not match CLI version ${cli && cli.version}`);
              process.exit(1);
            }
            const core = fs.readFileSync("crates/pidjezdy-core/src/config.rs", "utf8");
            const displayLimit = core.match(
              /pub\s+const\s+MAX_DISPLAY_DEPARTURES\s*:\s*usize\s*=\s*(\d+)\s*;/
            );
            const manifestLimit = plugin.barWidget.schema.find(setting => setting.key === "limit");
            if (!displayLimit
                || model.maxDisplayDepartures !== Number(displayLimit[1])
                || !manifestLimit
                || manifestLimit.max !== Number(displayLimit[1])) {
              console.error("plugin departure limits do not match MAX_DISPLAY_DEPARTURES");
              process.exit(1);
            }
          '
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  plugin-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check Model.js
      - run: node --test tests/model.test.js
      - run: node -e 'JSON.parse(require("fs").readFileSync("manifest.json", "utf8"))'

  release-please:
    needs: [rust, plugin-model]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
